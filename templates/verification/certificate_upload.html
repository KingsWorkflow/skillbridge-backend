{% extends "base.html" %}
{% block title %}Upload Certificate | SkillBridge Nepal{% endblock %}

{% block content %}
<div class="max-w-container-max mx-auto py-lg">
    <header class="mb-lg">
        <h1 class="font-headline-lg text-headline-lg text-on-background">Upload Certificate</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant">Verify your skills with certificates from recognized institutions.</p>
    </header>

    <form class="space-y-md max-w-2xl" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="space-y-2">
            <label class="font-label-md">Skill</label>
            <select class="w-full p-sm border border-outline-variant rounded-lg" name="skill">
                <option>Select a skill</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="font-label-md">Certificate File</label>
            <input class="w-full p-sm border border-outline-variant rounded-lg" name="certificate" type="file" accept=".pdf,.jpg,.png"/>
        </div>
        <div class="space-y-2">
            <label class="font-label-md">Issuing Organization</label>
            <input class="w-full p-sm border border-outline-variant rounded-lg" name="organization" type="text"/>
        </div>
        <button class="bg-primary text-on-primary px-lg py-sm rounded-lg font-label-md">Submit for Review</button>
    </form>
</div>
{% endblock %}
