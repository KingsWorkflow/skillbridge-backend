{% extends "base.html" %}
{% block title %}Password Reset Sent | SkillBridge Nepal{% endblock %}

{% block content %}
<div class="max-w-container-max mx-auto py-lg text-center">
    <div class="bg-white rounded-xl p-md shadow-sm border border-outline-variant max-w-md mx-auto">
        <span class="material-symbols-outlined text-primary text-6xl mb-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Check Your Email</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-lg">We've emailed you instructions for setting your password. If you don't receive an email, please check your spam folder.</p>
        <a href="{% url 'users:login' %}" class="bg-primary text-on-primary px-lg py-sm rounded-lg font-label-md text-label-md hover:opacity-90 transition-all">Back to Login</a>
    </div>
</div>
{% endblock %}
